# Schonhouse configuration. Credentials are NOT stored here: set TAPO_USERNAME and
# TAPO_PASSWORD in the environment or in a .env file next to the binary.

[server]
# Listen on every interface so the UI is reachable from the local network.
# Use "127.0.0.1:8080" to restrict it to this machine (for example behind a proxy).
bind = "0.0.0.0:8080"
# Seconds between state polls for each device.
poll_interval_secs = 10
# Where the UDP discovery query is broadcast. The limited broadcast address works on
# most networks; use your subnet broadcast (e.g. "192.168.0.255") if it does not.
discovery_broadcast = "255.255.255.255"

[storage]
# SQLite database holding devices, groups and scenes. Created on first start.
path = "schonhouse.db"

# Devices live in the database and are normally added from the UI (Add device -> Scan).
# Entries below are a seed: they are imported on startup when their id is not in the
# database yet. `name` is optional; without it the name set in the Tapo app is shown.

[[devices]]
id = "light-1"
kind = "tapo-l535"
ip = "192.168.0.2"

[[devices]]
id = "light-2"
kind = "tapo-l535"
ip = "192.168.0.3"
